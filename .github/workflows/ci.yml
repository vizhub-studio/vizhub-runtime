name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Type checking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Package build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
